name: asu_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  html: ^0.15.4
  webview_flutter: ^4.8.0
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  sensors_plus: ^7.1.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  add_2_calendar: ^3.0.1
  path_provider: ^2.1.6
  open_file: ^4.0.0
  device_calendar: ^4.3.3
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  image_path: "assets/images/app_logo.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.jpg"
  min_sdk_android: 21